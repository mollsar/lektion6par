<!DOCTYPE html>
<html lang="sv">
<head><meta charset="UTF-8"><title>Övning</title></head>
<body>
  <h1>Min övning</h1>
  <button onclick="hej()">Klicka här</button>
  <p id="output"></p>
  <script>
    function hej() {
      document.getElementById("output").textContent = "Hej " + new Date().toLocaleTimeString();
    }
  </script>
</body>
</html>
