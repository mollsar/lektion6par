<!DOCTYPE html>
<html lang="sv">

<head>
	<meta charset="UTF-8">
	<title>En liten gris har bott här</title>
</head>

<body>
  <h1>Min lilla sida</h1>
  <button onclick="hej()">Smasha musknappen här</button>
  <p id="output"></p>
  <script>
    function hej() {
      document.getElementById("output").textContent = "Hallå där din lilla groda " + new Date().toLocaleTimeString();
    }
  </script>
</body>

</html>
