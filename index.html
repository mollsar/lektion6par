<!DOCTYPE html>
<html lang="sv">

<head>
	<meta charset="UTF-8">
	<title>En liten katt har bott här</title>
</head>

<body>
  <h1>Min stora sida</h1>
  <button onclick="hej()">En magisk knapp som gör något</button>
  <p id="output"></p>
  <script>
    function hej() {
      document.getElementById("output").textContent = "Hallå där ditt lilla grodmonster " + new Date().toLocaleTimeString();
    }
  </script>
</body>

</html>
